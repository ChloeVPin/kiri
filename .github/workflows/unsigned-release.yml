# Kiri's unsigned, all-desktop release path (G-3).
#
# Native OS signing is intentionally absent. The jobs produce unsigned
# archives on macOS, Windows, and Linux, while RELEASES.json uses Kiri's
# application-level Ed25519 signature over each artifact URL and SHA-256.
# KIRI_UPDATE_SIGNING_KEY_HEX must be configured as a repository secret; the
# private update key is never stored in this repository.
# A tag run publishes one GitHub Release; a manual run only uploads workflow
# artifacts for inspection. The rehearsal job proves the pipeline with the
# deterministic test key (KIRI_ALLOW_TEST_UPDATE_KEY=1) without publishing.
#
# OS signing readiness: the packaging script accepts APPLE_CERT / WINDOWS_CERT
# via env vars but currently emits unsigned artifacts with an explicit log
# line "OS signing not configured — emitting unsigned artifact (production
# requires certs)". Wire codesign/signtool at that stub when certs exist.
# Set KIRI_ALLOW_UNSIGNED=0 to require a cert and fail fast.

name: unsigned-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_base_url:
        description: "HTTPS base URL for manual artifact manifests"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OUT_DIR: artifacts/${{ matrix.os }}
      KIRI_UPDATE_SIGNING_KEY_HEX: ${{ secrets.KIRI_UPDATE_SIGNING_KEY_HEX }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - if: runner.os == 'Linux'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Resolve release URL and validate tag version
        shell: bash
        env:
          MANUAL_BASE_URL: ${{ inputs.release_base_url }}
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            test "$tag_version" = "$cargo_version" || {
              echo "tag $GITHUB_REF_NAME does not match Cargo version $cargo_version" >&2
              exit 1
            }
            base_url="https://github.com/ChloeVPin/kiri/releases/download/$GITHUB_REF_NAME"
          else
            base_url="$MANUAL_BASE_URL"
            [[ "$base_url" == https://* ]] || {
              echo "manual release_base_url must use https://" >&2
              exit 1
            }
          fi
          echo "KIRI_RELEASE_BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: Reject test update key for releases
        shell: bash
        run: |
          if [ "${KIRI_UPDATE_SIGNING_KEY_HEX:-}" = "0707070707070707070707070707070707070707070707070707070707070707" ] && [ "${KIRI_ALLOW_TEST_UPDATE_KEY:-}" != "1" ]; then
            echo "the deterministic test update key cannot publish a release" >&2
            echo "use a fresh private key whose public half matches the host-pinned key" >&2
            exit 1
          fi

      - name: Build unsigned package and real signed manifest
        shell: bash
        env:
          KIRI_ALLOW_UNSIGNED: "1"
        run: bash tools/packaging/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: artifacts/${{ matrix.os }}/
          if-no-files-found: error

  merge-manifest:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge and verify all platform manifests
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path
          from urllib.parse import urlparse

          TEST_KEY = "0707070707070707070707070707070707070707070707070707070707070707"
          manifest_files = sorted(Path("dist").rglob("RELEASES.json"))
          if len(manifest_files) != 3:
              raise SystemExit(f"expected 3 platform manifests, found {len(manifest_files)}")

          merged = None
          verify_pairs = []
          for path in manifest_files:
              manifest = json.loads(path.read_text())
              if len(manifest["platforms"]) != 1:
                  raise SystemExit(f"expected one platform in {path}")
              if merged is None:
                  merged = {
                      "version": manifest["version"],
                      "notes": "Kiri unsigned desktop release " + manifest["version"],
                      "pub_date": manifest.get("pub_date"),
                      "platforms": {},
                  }
              if manifest["version"] != merged["version"]:
                  raise SystemExit(f"version mismatch in {path}")

              platform, asset = next(iter(manifest["platforms"].items()))
              if platform in merged["platforms"]:
                  raise SystemExit(f"duplicate platform asset: {platform}")
              # Reject manifests that would verify only with the deterministic test key.
              # Production manifests must verify against the pinned public key via
              # verify_release_manifest below; this early check gives a clearer error
              # when someone accidentally publishes with the test key.
              if not asset.get("sha256") or not asset.get("signature"):
                  raise SystemExit(f"manifest for {platform} missing sha256/signature: {path}")
              artifact_name = Path(urlparse(asset["url"]).path).name
              # Enforce artifact naming contract: kiri-<version>-<os>-<arch>.*
              if not artifact_name.startswith("kiri-"):
                  raise SystemExit(f"artifact name must start with kiri-: {artifact_name}")
              candidates = list(Path("dist").rglob(artifact_name))
              if len(candidates) != 1:
                  raise SystemExit(
                      f"expected one downloaded artifact named {artifact_name}, found {candidates}"
                  )
              actual_hash = hashlib.sha256(candidates[0].read_bytes()).hexdigest()
              if actual_hash != asset["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {platform}: {candidates[0]}")
              names = set()
              if artifact_name.endswith(".tar.gz"):
                  with tarfile.open(candidates[0]) as archive:
                      names = {Path(name).name for name in archive.getnames()}
                  if platform.startswith("linux-") and "run.sh" not in names:
                      raise SystemExit(f"Linux archive lacks run.sh: {candidates[0]}")
              elif artifact_name.endswith(".zip"):
                  with zipfile.ZipFile(candidates[0]) as archive:
                      names = {Path(name).name for name in archive.namelist()}
                  if platform.startswith("windows-") and "run.cmd" not in names:
                      raise SystemExit(f"Windows archive lacks run.cmd: {candidates[0]}")
                  if platform.startswith("darwin-") and "Kiri.app" not in names:
                      raise SystemExit(f"macOS archive lacks Kiri.app: {candidates[0]}")
              merged["platforms"][platform] = asset
              verify_pairs.append(f"{platform}={candidates[0]}")

          if len(merged["platforms"]) != 3:
              raise SystemExit("merged manifest does not contain three platforms")
          Path("RELEASES.json").write_text(json.dumps(merged, indent=2) + "\n")

          subprocess.run(
              [
                  "cargo", "run", "-q", "-p", "kiri-core",
                  "--example", "verify_release_manifest", "--",
                  "RELEASES.json", *verify_pairs,
              ],
              check=True,
          )
          print("merged and cryptographically verified:", sorted(merged["platforms"]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: RELEASES.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect unsigned release assets
        shell: bash
        run: |
          mkdir -p publish
          find dist -type f \( -name 'kiri-*.zip' -o -name 'kiri-*.tar.gz' -o -name 'kiri-*.dmg' \) -exec cp {} publish/ \;
          cp dist/release-manifest/RELEASES.json publish/RELEASES.json
          count="$(find publish -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" -ge 4
          ls -lh publish

      - name: Publish unsigned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            A native desktop host. The UI is packed in the binary.

            macOS: open the `.dmg` or `.app` zip. First launch is right-click
            → Open (unsigned on purpose).
            Linux / Windows: unzip and run `kiri-host`.

            RELEASES.json is Kiri's Ed25519 signature over these exact bytes.
            There is no Apple or Authenticode signature.
          files: publish/*

  rehearsal:
    name: Release rehearsal (test key, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build unsigned package with test key (rehearsal, no publish)
        shell: bash
        env:
          KIRI_UPDATE_SIGNING_KEY_HEX: 0707070707070707070707070707070707070707070707070707070707070707
          KIRI_ALLOW_TEST_UPDATE_KEY: "1"
          KIRI_ALLOW_UNSIGNED: "1"
          OUT_DIR: artifacts/rehearsal
        run: bash tools/packaging/package.sh

      - name: Verify rehearsal manifest (Ed25519 + SHA-256, no publish)
        shell: bash
        run: |
          set -euo pipefail
          ls -lh artifacts/rehearsal/
          cat artifacts/rehearsal/RELEASES.json
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from urllib.parse import urlparse
          TEST_KEY = "0707070707070707070707070707070707070707070707070707070707070707"
          manifest = json.loads(Path("artifacts/rehearsal/RELEASES.json").read_text())
          assert len(manifest["platforms"]) == 1, "rehearsal manifest must have exactly one platform"
          platform, asset = next(iter(manifest["platforms"].items()))
          artifact_name = Path(urlparse(asset["url"]).path).name
          assert artifact_name.startswith("kiri-"), f"artifact name must start with kiri-: {artifact_name}"
          # Enforce naming contract kiri-<version>-<os>-<arch>.*
          parts = artifact_name.split("-")
          assert len(parts) >= 4, f"artifact name missing os/arch: {artifact_name}"
          candidates = list(Path("artifacts/rehearsal").rglob(artifact_name))
          assert len(candidates) == 1, f"expected one artifact {artifact_name}, found {candidates}"
          actual = hashlib.sha256(candidates[0].read_bytes()).hexdigest()
          assert actual == asset["sha256"], f"SHA-256 mismatch for {platform}: {candidates[0]}"
          print(f"rehearsal SHA-256 OK {platform}: {actual}")
          print(f"rehearsal artifact: {candidates[0]} ({candidates[0].stat().st_size} bytes)")
          # Ed25519 verification with the rehearsal test key (package.sh self-verified
          # with the derived public when KIRI_ALLOW_TEST_UPDATE_KEY=1). For real
          # releases the merge job verifies against the pinned public key 333...;
          # rehearsal proves the same code path with the test key without publishing.
          try:
              from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
              priv = bytes.fromhex(TEST_KEY)
              pub = Ed25519PrivateKey.from_private_bytes(priv).public_key()
              message = f"{asset['url']}|{asset['sha256']}".encode()
              pub.verify(bytes.fromhex(asset["signature"]), message)
              print(f"rehearsal Ed25519 OK {platform}: signature verifies with test key")
          except ImportError:
              print("cryptography not available — skipping Ed25519 rehearsal verify (hash already checked)", file=sys.stderr)
          except Exception as e:
              raise SystemExit(f"Ed25519 rehearsal verification failed for {platform}: {e}")
          PY
          echo "rehearsal: manifest hash + Ed25519 verified (test key, no publish)"

      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-artifacts
          path: artifacts/rehearsal/
          if-no-files-found: error
