# Controlled startup-benchmark comparison: Kiri vs Wry/Tao vs Tauri.
#
# The repository is PUBLIC, so GitHub-hosted runners (ubuntu/macos/windows)
# are FREE and unlimited. This workflow therefore runs the three-way startup
# benchmark on hosted runners at $0 cost -- the previous version required a
# nonexistent [self-hosted, windows, x64, kiri-perf] runner.
#
# What runs where:
#   - macOS and Windows: Kiri, Wry/Tao where supported, and Tauri startup.
#     Kiri vs Tauri through-webview IPC is measured on each supported runner.
#     On Windows Kiri uses direct WebView2. Official Kiri numbers do NOT
#     set KIRI_WEBVIEW2_ARGS. A separate swrender row keeps --disable-gpu as
#     a labeled appendix. wry-tao is re-enabled (with_html on Windows).
#   - Linux: baselines compile; the native WebView run is a SOFT probe
#     (headless WebKit2GTK has no GPU on runners), so no benchmark numbers
#     are emitted for Linux native here.
#
# To get a pinned, low-noise perf machine later, uncomment the self-hosted
# job below and register a runner with those labels. Self-hosted is also free
# on a public repo.

name: controlled-performance
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # Hosted, free on public repo. Real GPU on macOS and Windows.
  hosted-comparison:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build Kiri host (release)
        run: cargo build --release -p kiri-runtime --bin kiri-host
      - name: Build Wry/Tao baseline (release)
        run: cargo build --release --manifest-path baselines/wry-tao/Cargo.toml
      - name: Build Tauri baseline (release)
        run: cargo build --release --manifest-path baselines/tauri/Cargo.toml

      - name: Startup benchmark (Kiri host)
        shell: pwsh
        if: runner.os == 'Windows'
        run: python benchmark/harness.py --name startup-kiri --runs 20 --output artifacts/startup-kiri.json -- .\target\release\kiri-host.exe --smoke --frontend examples\blank
      - name: Startup benchmark (Kiri host)
        if: runner.os == 'macOS'
        run: python3 benchmark/harness.py --name startup-kiri --runs 20 --output artifacts/startup-kiri.json -- ./target/release/kiri-host --smoke --frontend examples/blank

      - name: Startup benchmark (Kiri embedded)
        shell: pwsh
        if: runner.os == 'Windows'
        run: python benchmark/harness.py --name startup-kiri-embed --runs 20 --output artifacts/startup-kiri-embed.json -- .\target\release\kiri-host.exe --smoke
      - name: Startup benchmark (Kiri embedded)
        if: runner.os == 'macOS'
        run: python3 benchmark/harness.py --name startup-kiri-embed --runs 20 --output artifacts/startup-kiri-embed.json -- ./target/release/kiri-host --smoke

      - name: Startup benchmark (Kiri starter, first-invoke)
        shell: pwsh
        if: runner.os == 'Windows'
        run: python benchmark/harness.py --name startup-kiri-starter --runs 20 --output artifacts/startup-kiri-starter.json -- .\target\release\kiri-host.exe --smoke --frontend examples\starter
      - name: Startup benchmark (Kiri starter, first-invoke)
        if: runner.os == 'macOS'
        run: python3 benchmark/harness.py --name startup-kiri-starter --runs 20 --output artifacts/startup-kiri-starter.json -- ./target/release/kiri-host --smoke --frontend examples/starter

      - name: Startup benchmark (Kiri host, software WebView2 appendix)
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          KIRI_WEBVIEW2_ARGS: --disable-gpu
        run: python benchmark/harness.py --name startup-kiri-swrender --runs 20 --output artifacts/startup-kiri-swrender.json -- .\target\release\kiri-host.exe --smoke --frontend examples\blank

      - name: Startup benchmark (Wry/Tao baseline)
        if: runner.os == 'macOS'
        run: python3 benchmark/harness.py --name startup-wry --runs 20 --output artifacts/startup-wry.json -- ./baselines/wry-tao/target/release/wry-tao-baseline --smoke
      - name: Startup benchmark (Wry/Tao baseline)
        shell: pwsh
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python benchmark/harness.py --name startup-wry --runs 20 --warmups 1 --timeout-seconds 20 --output artifacts/startup-wry.json -- .\baselines\wry-tao\target\release\wry-tao-baseline.exe

      - name: Startup benchmark (Tauri baseline)
        shell: pwsh
        if: runner.os == 'Windows'
        run: python benchmark/harness.py --name startup-tauri --runs 20 --output artifacts/startup-tauri.json -- .\baselines\tauri\target\release\tauri-baseline.exe
      - name: Startup benchmark (Tauri baseline)
        if: runner.os == 'macOS'
        run: python3 benchmark/harness.py --name startup-tauri --runs 20 --output artifacts/startup-tauri.json -- ./baselines/tauri/target/release/tauri-baseline --smoke

      - name: Through-webview IPC (Kiri)
        if: runner.os == 'macOS'
        run: ./target/release/kiri-host --frontend examples/blank --ipc-bench --ipc-bench-runs 20 --ipc-bench-out artifacts/ipc-kiri.json --markers-out artifacts/startup-kiri-ipc.json
      - name: Through-webview IPC (Kiri)
        shell: pwsh
        if: runner.os == 'Windows'
        continue-on-error: true
        run: .\target\release\kiri-host.exe --frontend examples\blank --ipc-bench --ipc-bench-runs 20 --ipc-bench-out artifacts\ipc-kiri.json --markers-out artifacts\startup-kiri-ipc.json

      - name: Through-webview IPC (Tauri)
        if: runner.os == 'macOS'
        run: KIRI_IPC_BENCH=1 KIRI_IPC_BENCH_RUNS=20 KIRI_IPC_BENCH_OUT=artifacts/ipc-tauri.json ./baselines/tauri/target/release/tauri-baseline
      - name: Through-webview IPC (Tauri)
        shell: pwsh
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          $env:KIRI_IPC_BENCH = "1"
          $env:KIRI_IPC_BENCH_RUNS = "20"
          $env:KIRI_IPC_BENCH_OUT = "artifacts\ipc-tauri.json"
          .\baselines\tauri\target\release\tauri-baseline.exe

      - name: Record binary sizes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          artifacts = pathlib.Path("artifacts")
          artifacts.mkdir(exist_ok=True)
          sizes = {}
          for p in pathlib.Path(".").rglob("*"):
              if p.name in ("kiri-host", "kiri-host.exe", "tauri-baseline", "tauri-baseline.exe", "wry-tao-baseline", "wry-tao-baseline.exe") and p.is_file() and "release" in p.parts:
                  sizes[str(p).replace("\\", "/")] = p.stat().st_size
          (artifacts / "binary-sizes.json").write_text(json.dumps(sizes, indent=2) + "\n")
          print(json.dumps(sizes, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn

  # Optional: pin to a dedicated low-noise machine. Free on public repos.
