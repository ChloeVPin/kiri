name: windows-host-smoke
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    concurrency:
      group: kiri-windows-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p kiri-runtime-windows --bin kiri-host
      - name: Smoke run
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          .\target\release\kiri-host.exe --smoke --frontend examples/blank --markers-out artifacts\startup.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content artifacts\startup.json
      - name: Verify startup markers
        shell: pwsh
        run: |
          python -c "
          import json
          d = json.load(open('artifacts/startup.json'))
          names = {m['name'] for m in d['markers']}
          required = {'webview_ready', 'bridge_ready', 'dom_ready', 'first_animation_frame'}
          missing = required - names
          assert not missing, f'missing markers: {missing}'
          print('startup markers OK:', sorted(names))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: windows-startup-result
          path: artifacts/

  stress:
    runs-on: windows-latest
    needs: smoke
    concurrency:
      group: kiri-windows-stress
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p kiri-runtime-windows --bin kiri-host-stress
      - name: Stress loop (100 launch-close cycles)
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          .\target\release\kiri-host-stress.exe --cycles 100 --frontend examples/blank --exit-after-ready-ms 250 --watchdog-ms 30000 2>&1 | Tee-Object -FilePath artifacts\stress.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: windows-stress-log
          path: artifacts/stress.log