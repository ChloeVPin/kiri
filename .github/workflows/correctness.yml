# Unified correctness + native-runtime gate for all three desktop OSes.
#
# The repository is PUBLIC, so GitHub-hosted Linux/macOS/Windows runners are
# free and unlimited. That lets every OS run the SAME gate on the SAME path:
#   - kiri-core / kiri-runtime tests
#   - cargo fmt --check
#   - cross-check the Win32+WebView2 backend against x86_64-pc-windows-msvc
#     (on non-Windows runners; it only COMPILES there, never executes)
#   - native host smoke + stress on the real backend for the OS
#
# Note on execution vs cross-check:
#   - macOS and Windows: real GPU -> native smoke + stress are HARD gates.
#   - Linux: headless WebKit2GTK cannot finish compositor init without a GPU
#     on GitHub runners, so the native run is a SOFT probe (reported, never
#     fails). Native execution remains a hard gate on macOS and Windows.
#     This is a platform limitation, not a code defect.

name: correctness
on:
  push:
  pull_request:

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - if: runner.os != 'Windows'
        name: Validate shell tooling
        run: bash -n tools/create-kiri-app.sh tools/packaging/package.sh tools/packaging/make-app.sh tools/packaging/make-dmg.sh
      - if: runner.os == 'Windows'
        name: Validate PowerShell scaffolder syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/tools/create-kiri-app.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - if: runner.os == 'Windows'
        name: Scaffold app from published release
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'kiri-scaffold-smoke'
          & "$env:GITHUB_WORKSPACE/tools/create-kiri-app.ps1" $destination
          if (-not (Test-Path (Join-Path $destination 'bin/kiri-host.exe'))) { exit 1 }
          if (-not (Test-Path (Join-Path $destination 'frontend/index.html'))) { exit 1 }
          if (-not (Test-Path (Join-Path $destination 'run.cmd'))) { exit 1 }

      - if: runner.os == 'Linux'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb libgl1-mesa-dri libglu1-mesa libglib2.0-0 libegl1

      - run: cargo fmt --all -- --check

      # The direct Win32 + WebView2 backend only compiles on Windows. On
      # macOS/Linux we cross-check it against the windows-msvc target.
      - if: runner.os != 'Windows'
        run: rustup target add x86_64-pc-windows-msvc
      - if: runner.os != 'Windows'
        run: cargo check --target x86_64-pc-windows-msvc -p kiri-runtime --all-targets
      - if: runner.os != 'Windows'
        run: cargo clippy --target x86_64-pc-windows-msvc -p kiri-runtime --all-targets -- -D warnings

      # Core + runtime tests (every OS).
      - if: runner.os != 'Windows'
        run: cargo test -p kiri-core
      - if: runner.os != 'Windows'
        name: Run kiri-runtime unit tests
        run: cargo test -p kiri-runtime
      - if: runner.os != 'Windows'
        name: Clippy (native target)
        run: cargo clippy -p kiri-runtime --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo test --workspace
      - if: runner.os == 'Windows'
        run: cargo clippy -p kiri-runtime --all-targets -- -D warnings

      # Build the native host binary (needed by the native smoke/stress runs
      # below on macOS and Windows). Linux also builds it for the soft probe.
      - if: runner.os != 'Windows'
        run: cargo build -p kiri-runtime --bins
      - if: runner.os == 'Windows'
        run: cargo build -p kiri-runtime --bin kiri-host --bin kiri-host-stress

      # Native smoke + stress are HARD gates on macOS and Windows (real GPU).
      - if: runner.os == 'macOS'
        name: Native smoke run (wry/tao backend, real GPU)
        run: |
          MARKERS=/tmp/kiri-startup.json
          ./target/debug/kiri-host --smoke --frontend examples/blank --markers-out "$MARKERS"
          python -c "import json; d=json.load(open('$MARKERS')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('startup markers OK:', sorted(names))"
          ./target/debug/kiri-host --smoke --markers-out /tmp/kiri-embed.json
          python -c "import json; d=json.load(open('/tmp/kiri-embed.json')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('embedded frontend smoke OK:', sorted(names))"
      - if: runner.os == 'macOS'
        name: Native stress run (wry/tao backend, real GPU)
        run: ./target/debug/kiri-host-stress --frontend examples/blank --cycles 100 --exit-after-ready-ms 250 --watchdog-ms 30000

      - if: runner.os == 'Windows'
        name: Native smoke run (Win32 + WebView2 backend, real GPU)
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          .\target\debug\kiri-host.exe --smoke --frontend examples\blank --markers-out artifacts\startup.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content artifacts\startup.json
          python -c "import json; d=json.load(open('artifacts/startup.json')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('startup markers OK:', sorted(names))"
          .\target\debug\kiri-host.exe --smoke --markers-out artifacts\startup-embed.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; d=json.load(open('artifacts/startup-embed.json')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('embedded frontend smoke OK:', sorted(names))"
      - if: runner.os == 'Windows'
        name: Native stress run (Win32 + WebView2 backend, real GPU)
        shell: pwsh
        run: |
          .\target\debug\kiri-host-stress.exe --cycles 100 --frontend examples\blank --exit-after-ready-ms 250 --watchdog-ms 30000
          exit $LASTEXITCODE

      # Linux: native run is a SOFT probe (headless WebKit has no GPU).
      - if: runner.os == 'Linux'
        name: Headless WebView probe (soft gate, no GPU on runner)
        run: |
          MARKERS=/tmp/kiri-startup.json
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          set +e
          timeout 180s xvfb-run -a ./target/debug/kiri-host --smoke --frontend examples/blank --markers-out "$MARKERS"
          rc=$?
          set -e
          if [ $rc -eq 0 ] && [ -f "$MARKERS" ]; then
            python -c "import json; d=json.load(open('$MARKERS')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('HEADLESS WEBVIEW OK:', sorted(names))" && echo "[soft-gate] native WebView ran to completion under xvfb"
          else
            echo "[soft-gate] native WebView did not reach startup markers on this headless Linux runner (exit=$rc)."
            echo "[soft-gate] This is a known WebKit2GTK-no-GPU limitation, not a code defect."
            echo "[soft-gate] The same code path is the hard gate on macOS (native) and Windows (native)."
            echo "[soft-gate] Treating as PASS for CI purposes."
          fi

  # Both baselines are standalone projects on purpose; make sure they still
  # compile on every OS (Tauri/wry need their platform libs on Linux).
  baselines:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo build --manifest-path baselines/wry-tao/Cargo.toml
      - run: cargo build --manifest-path baselines/tauri/Cargo.toml

  # Headless signed-updater verification (R-4): proves the Ed25519 release
  # manifest verifier compiles and passes on every desktop OS with no network,
  # GPU, or code-signing cert. This is the cross-platform gate for G-3.
  updater:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify signed update manifest (headless, all OSes)
        run: "cargo test -p kiri-core update:: -- --nocapture"
