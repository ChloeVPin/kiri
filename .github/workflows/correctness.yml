name: correctness
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      # The Windows runtime (kiri-runtime-windows) only compiles on Windows.
      # On macOS/Linux we cross-check it against the windows-msvc target;
      # clippy/test runs only over the platform-neutral workspace members.
      - if: runner.os != 'Windows'
        run: rustup target add x86_64-pc-windows-msvc
      - if: runner.os != 'Windows'
        run: cargo check --target x86_64-pc-windows-msvc -p kiri-runtime-windows --all-targets
      - if: runner.os != 'Windows'
        run: cargo test -p kiri-core
      - if: runner.os != 'Windows'
        run: cargo clippy -p kiri-core --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo test --workspace
      - if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Both baselines are standalone projects on purpose; make sure they still
  # compile on every OS (Tauri/wry need their platform libs on Linux).
  baselines:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo check --manifest-path baselines/wry-tao/Cargo.toml
      - run: cargo check --manifest-path baselines/tauri/Cargo.toml