name: correctness
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The wry/tao backend builds and runs natively on Linux, but it needs the
      # system WebKit/GTK libraries and a display server. Install them (mirroring
      # the baselines job) plus a virtual framebuffer so the host can open a
      # window headlessly under CI.
      - if: runner.os == 'Linux'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb
      - run: cargo fmt --all -- --check
      # The direct Win32 + WebView2 backend only compiles on Windows. On
      # macOS/Linux we cross-check it against the windows-msvc target and
      # also build + exercise the native wry/tao backend.
      - if: runner.os != 'Windows'
        run: rustup target add x86_64-pc-windows-msvc
      - if: runner.os != 'Windows'
        run: cargo check --target x86_64-pc-windows-msvc -p kiri-runtime --all-targets
      - if: runner.os != 'Windows'
        run: cargo clippy --target x86_64-pc-windows-msvc -p kiri-runtime --all-targets -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo test -p kiri-core
      - if: runner.os != 'Windows'
        run: cargo build -p kiri-runtime --bins
      - if: runner.os != 'Windows'
        name: Native smoke run (wry/tao backend)
        run: |
          MARKERS=/tmp/kiri-startup.json
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./target/debug/kiri-host --smoke --frontend examples/blank --markers-out "$MARKERS"
          else
            ./target/debug/kiri-host --smoke --frontend examples/blank --markers-out "$MARKERS"
          fi
          python -c "import json; d=json.load(open('$MARKERS')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('startup markers OK:', sorted(names))"
      - if: runner.os != 'Windows'
        name: Native stress run (wry/tao backend)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./target/debug/kiri-host-stress --frontend examples/blank --cycles 100 --exit-after-ready-ms 250 --watchdog-ms 30000
          else
            ./target/debug/kiri-host-stress --frontend examples/blank --cycles 100 --exit-after-ready-ms 250 --watchdog-ms 30000
          fi
      - if: runner.os == 'Windows'
        run: cargo test --workspace
      - if: runner.os == 'Windows'
        run: cargo clippy -p kiri-runtime --all-targets -- -D warnings

  # Both baselines are standalone projects on purpose; make sure they still
  # compile on every OS (Tauri/wry need their platform libs on Linux).
  baselines:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo check --manifest-path baselines/wry-tao/Cargo.toml
      - run: cargo check --manifest-path baselines/tauri/Cargo.toml
