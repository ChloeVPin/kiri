version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
  - package-ecosystem: cargo
    directory: "/baselines/wry-tao"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "baseline"]
  - package-ecosystem: cargo
    directory: "/baselines/tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "baseline"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
