[workspace]
resolver = "2"
members = [
  "crates/kiri-core",
  "crates/kiri-runtime",
]
default-members = ["crates/kiri-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
repository = "https://example.invalid/kiri"
description = "Kiri native desktop runtime (working name, provisional)"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

serde_json = "1"
ed25519-dalek = { version = "2", features = ["zeroize"] }
hex = "0.4"

# The workspace intentionally does not include baselines/.
# Tauri and Wry/Tao baselines are standalone projects (own Cargo.lock) so their
# heavy dependency trees never slow core workspace builds or tests. See
# baselines/README.md and docs/12-benchmarks.md.