[workspace]
resolver = "2"
members = [
  "crates/kiri-core",
  "crates/kiri-runtime",
]
default-members = ["crates/kiri-core"]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.77"
repository = "https://github.com/ChloeVPin/kiri"
description = "Kiri: a native desktop app runtime where a granted capability must not be enough"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

serde_json = "1"
ed25519-dalek = { version = "2", features = ["zeroize"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# The workspace intentionally does not include baselines/.
# Tauri and Wry/Tao baselines are standalone projects (own Cargo.lock) so their
# heavy dependency trees never slow core workspace builds or tests. See
# baselines/README.md and docs/12-benchmarks.md.
