# Copy into .github/workflows/build.yml in an app repo created from
# templates/embed-ipc-app/. Builds one native binary per OS with the
# frontend already packed inside (see .cargo/config.toml), then uploads
# just that binary. No Kiri release download, no frontend sidecar folder.
#
# Binaries are unsigned at the OS level: macOS Gatekeeper and Windows
# SmartScreen may warn on first run.

name: single-binary
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bin: kiri-ipc-app
          - os: windows-latest
            bin: kiri-ipc-app.exe
          - os: ubuntu-latest
            bin: kiri-ipc-app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - if: runner.os == 'Linux'
        name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev xvfb libgl1-mesa-dri libglu1-mesa libglib2.0-0 libegl1

      - name: Build single binary (frontend packed via .cargo/config.toml)
        run: cargo build --release

      - name: Prove the UI is inside the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/${{ matrix.bin }}"
          test -f "$bin"
          python - "$bin" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()
          assert b"kiri-embed-ipc-demo" in data, "embedded index.html marker missing"
          print("embedded frontend marker found in", sys.argv[1])
          PY

      # Embedded smoke: no --frontend flag, so the packed UI is the only
      # possible source. Hard gate where the runner has a real GPU.
      - if: runner.os != 'Linux'
        name: Embedded smoke run (real GPU)
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/${{ matrix.bin }} --smoke --markers-out /tmp/embed-markers.json
          python -c "import json; d=json.load(open('/tmp/embed-markers.json')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('embedded smoke OK:', sorted(names))"

      # Linux hosted runners have no GPU; same probe as the kiri repo's
      # correctness workflow: report, never fail.
      - if: runner.os == 'Linux'
        name: Embedded smoke probe (soft gate, no GPU on runner)
        shell: bash
        run: |
          set +e
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_DISABLE_DMABUF_RENDERER=1
          timeout 180s xvfb-run -a ./target/release/${{ matrix.bin }} --smoke --markers-out /tmp/embed-markers.json
          rc=$?
          set -e
          if [ $rc -eq 0 ] && [ -f /tmp/embed-markers.json ]; then
            python -c "import json; d=json.load(open('/tmp/embed-markers.json')); names={m['name'] for m in d['markers']}; req={'webview_ready','bridge_ready','dom_ready','first_animation_frame'}; miss=req-names; assert not miss, f'missing markers: {miss}'; print('embedded smoke OK:', sorted(names))"
          else
            echo "[soft-gate] headless WebKit2GTK did not reach startup markers (exit=$rc); known no-GPU limitation, not a code defect"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: target/release/${{ matrix.bin }}
