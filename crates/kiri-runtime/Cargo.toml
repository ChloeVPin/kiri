[package]
name = "kiri-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native host for Kiri: direct Win32 + WebView2 on Windows, wry/tao on macOS/Linux"

[[bin]]
name = "kiri-host"
path = "src/bin/kiri-host.rs"

[[bin]]
name = "kiri-host-stress"
path = "src/bin/kiri-host-stress.rs"

[dependencies]
kiri-core = { path = "../kiri-core" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3"
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
arboard = "3"
tao = "0.36"
wry = "0.56.1"

[dev-dependencies]
serde_json.workspace = true