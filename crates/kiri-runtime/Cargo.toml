[package]
name = "kiri-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native host for Kiri for Linux, macOS, and Windows (wry/tao on Linux and macOS, Win32 + WebView2 on Windows)"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kiri-host"
path = "src/bin/kiri-host.rs"

[[bin]]
name = "kiri-host-stress"
path = "src/bin/kiri-host-stress.rs"

[dependencies]
kiri-core = { path = "../kiri-core", version = "0.1.7" }
serde.workspace = true
serde_json.workspace = true
notify = "8.2.0"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
muda = "0.19.3"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3"
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
arboard = "3"
tao = "0.36"
wry = "0.56.1"

[dev-dependencies]
serde_json.workspace = true
