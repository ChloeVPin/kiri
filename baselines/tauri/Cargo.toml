[package]
name = "tauri-baseline"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Blank Tauri baseline app for Kiri benchmarks (docs/12-benchmarks.md)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = 2
lto = "thin"